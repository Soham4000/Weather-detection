# rain_prediction.yml
# Configuration for the Weather Detector project.
# Add as many cities/townships as you want under "locations" -- there's no
# hard limit; the fetcher automatically splits large lists into safe
# request batches (see api.batch_size below).

locations:
  - name: "Durgapur"
    country: "IN"
    latitude: 23.5204
    longitude: 87.3119
  - name: "Asansol"
    country: "IN"
    latitude: 23.6739
    longitude: 86.9524
  - name: "Kolkata"
    country: "IN"
    latitude: 22.5726
    longitude: 88.3639
  - name: "Bardhaman"
    country: "IN"
    latitude: 23.2324
    longitude: 87.8615
  - name: "Kharagpur"
    country: "IN"
    latitude: 22.3460
    longitude: 87.2320
  # Add more entries here, e.g.:
  # - name: "Your Town"
  #   country: "IN"
  #   latitude: 0.0000
  #   longitude: 0.0000

timezone: "Asia/Kolkata"     # applied to all locations in this run

api:
  base_url: "https://api.open-meteo.com/v1/forecast"
  forecast_days: 2
  batch_size: 50              # max locations per API request (keeps URLs safe)

thresholds:
  # An hour counts as "rain" if its precipitation probability (%) is >= this
  rain_probability_percent: 40
  # An hour counts as "sunny" if its cloud cover (%) is <= this
  sunny_cloud_cover_percent: 30
  # Ignore rain/sunny stretches shorter than this many minutes (removes noise)
  min_window_minutes: 60

output:
  time_format: "%I:%M %p"      # e.g. 03:00 PM
  verbose: false                # print hour-by-hour detail per city (noisy with many cities)
  show_disclaimer: true
  save_results_json: true       # write a machine-readable summary for automation
  results_path: "results/latest.json"

telegram:
  enabled: true
  bot_token_env: "TELEGRAM_BOT_TOKEN"   # name of the GitHub Secret holding your bot token
  chat_id_env: "TELEGRAM_CHAT_ID"       # name of the GitHub Secret for the default broadcast chat (optional -- only used for alert_on below)
  alert_on: ["rain"]                     # optional broadcast to the default chat above -- also add "sunny" if wanted
  min_confidence_percent: 60             # only broadcast when confidence is at least this high
  always_send_summary: false             # true = broadcast a digest to the default chat every run too
  respond_to_city_requests: true         # let users text a city/township name to SUBSCRIBE to that city's updates
  subscriptions_path: "data/subscriptions.json"   # where per-user city subscriptions are stored between runs
