# rain_prediction.yml
# Configuration for the Weather Detector project.
# Add as many cities/townships as you want under "locations" -- there's no
# hard limit; the fetcher automatically splits large lists into safe
# request batches (see api.batch_size below).

locations:
  - name: "Durgapur"
    country: "IN"
    latitude: 23.5204
    longitude: 87.3119
  - name: "Asansol"
    country: "IN"
    latitude: 23.6739
    longitude: 86.9524
  - name: "Kolkata"
    country: "IN"
    latitude: 22.5726
    longitude: 88.3639
  - name: "Bardhaman"
    country: "IN"
    latitude: 23.2324
    longitude: 87.8615
  - name: "Kharagpur"
    country: "IN"
    latitude: 22.3460
    longitude: 87.2320
  # Add more entries here, e.g.:
  # - name: "Your Town"
  #   country: "IN"
  #   latitude: 0.0000
  #   longitude: 0.0000

timezone: "Asia/Kolkata"     # applied to all locations in this run

api:
  base_url: "https://api.open-meteo.com/v1/forecast"
  forecast_days: 2
  batch_size: 50              # max locations per API request (keeps URLs safe)

thresholds:
  rain_probability_percent: 40
  sunny_cloud_cover_percent: 30
  min_window_minutes: 60

output:
  time_format: "%I:%M %p"
  verbose: false
  show_disclaimer: true
  save_results_json: true
  results_path: "results/latest.json"

telegram:
  enabled: true
  bot_token_env: "TELEGRAM_BOT_TOKEN"   # name of the GitHub Secret holding your bot token
  chat_id_env: "TELEGRAM_CHAT_ID"       # name of the GitHub Secret holding your chat ID
  alert_on: ["rain"]
  min_confidence_percent: 60
  always_send_summary: false
  respond_to_city_requests: true
